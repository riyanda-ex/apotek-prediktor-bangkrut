name: Test Otomatis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil kode
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Jalankan 7 test
      run: |
        python -m py_compile main.py
        python test.py

    - name: Cek config.json valid
      run: python -c "import json; json.load(open('config.json')); print('config.json OK')"
